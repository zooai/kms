name: Docker

on:
  push:
    branches: [main, dev]
    tags: ['v*']

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/zooai/kms
      build-args: |
        GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR=${{ github.actor }}
    secrets: inherit
